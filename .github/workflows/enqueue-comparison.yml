name: Temporary synthetic commit-delay comparison

on:
  push:
    branches: [diagnostics/enqueue-comparison]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: gateway_test
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: ci-local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BASELINE_SHA: fce4bc9e2c68de2348f73739c7fdaad0078b490b
      CANDIDATE_SHA: bf9bf27cc60ecb104ecb626cc681e1fcbd612760
      TELEMETRY_SHA: 7f59bb3dbc0bd972088cc48d453fe8b34d54e6b8
      COMPARISON_MODE: synthetic-commit-delay
      BENCH_DATABASE_URL: postgres://gateway:ci-local-password@localhost:5432/gateway_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 7f59bb3dbc0bd972088cc48d453fe8b34d54e6b8
          path: .bench/telemetry
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Prepare pinned checkouts
        run: |
          git worktree add --detach .bench/baseline "$BASELINE_SHA"
          git worktree add --detach .bench/candidate "$CANDIDATE_SHA"
          git -C .bench/telemetry diff --exit-code "$BASELINE_SHA" -- src migrations tests package.json package-lock.json tsconfig.json tsconfig.test.json
          git -C .bench/candidate diff --exit-code "$BASELINE_SHA" -- migrations package.json package-lock.json tsconfig.json tsconfig.test.json
          for variant in baseline candidate telemetry; do
            npm ci --prefix ".bench/$variant"
            npm run build --prefix ".bench/$variant"
          done
      - name: Enable WAL timing on the disposable service
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U gateway -d gateway_test -c "ALTER SYSTEM SET track_wal_io_timing=on"
          docker exec "$POSTGRES_CONTAINER" psql -U gateway -d gateway_test -c "SELECT pg_reload_conf()"
          docker exec "$POSTGRES_CONTAINER" psql -U gateway -d gateway_test -c "ALTER ROLE gateway SET commit_delay=8000"
          docker exec "$POSTGRES_CONTAINER" psql -U gateway -d gateway_test -c "ALTER ROLE gateway SET commit_siblings=0"
      - name: Compare one matched synthetic-delay baseline and candidate pair
        env:
          DIAGNOSTIC_BENCH_ENTRY: .bench/telemetry/scripts/bench.mjs
          BENCH_DIAGNOSTICS: '1'
        run: node scripts/compare-enqueue.mjs
      - name: Publish complete diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enqueue-synthetic-commit-delay
          path: benchmark-comparison-output/
          if-no-files-found: error
