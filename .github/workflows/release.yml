name: Portable release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: ci-local-password
          POSTGRES_DB: gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://gateway:ci-local-password@localhost:5432/gateway_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
      - uses: docker/setup-buildx-action@v3
      - name: Verify application before packaging
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm run test:integration
      - name: Validate shell scripts
        run: for script in release/*.sh; do bash -n "$script"; done
      - name: Select bundle version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$GITHUB_SHA"
          if [[ "$REF_TYPE" == tag ]]; then version="$REF_NAME"; fi
          [[ "$version" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,100}$ ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Build prebuilt application and database bundle
        env:
          BUNDLE_VERSION: ${{ steps.version.outputs.version }}
          BUNDLE_PLATFORM: linux/${{ matrix.arch }}
        run: bash release/build-bundle.sh "$BUNDLE_PLATFORM" "$BUNDLE_VERSION"
      - name: Install, reinstall, back up, and restore the prebuilt bundle
        env:
          CI: 'true'
          BUNDLE_VERSION: ${{ steps.version.outputs.version }}
          BUNDLE_ARCH: ${{ matrix.arch }}
        run: bash release/smoke-install.sh "release-artifacts/commerce-gateway-$BUNDLE_VERSION-linux-$BUNDLE_ARCH.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: commerce-gateway-linux-${{ matrix.arch }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: commerce-gateway-linux-*
          path: release-artifacts
          merge-multiple: true
      - name: Publish tested bundles only for a release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-artifacts/* --verify-tag --generate-notes --title "$RELEASE_TAG"
