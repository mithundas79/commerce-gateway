name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [26]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: gateway_test
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: ci-local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://gateway:ci-local-password@localhost:5432/gateway_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node --test tests/bench.test.mjs
      - run: npm run build
        id: build
      - run: npm run test:integration
      - name: Measure local gateway overhead
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: BENCH_DATABASE_URL="$DATABASE_URL" npm run bench
      - name: Verify release archive
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/verify-package.mjs
      - name: Build container
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: docker build --tag commerce-gateway:ci .
