name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [26]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: gateway_test
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: ci-local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://gateway:ci-local-password@localhost:5432/gateway_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        id: build
      - run: npm run test:integration
      - name: Measure local gateway overhead
        shell: bash
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          BENCH_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          BENCH_DATABASE_URL="$DATABASE_URL" BENCH_DIAGNOSTICS=1 node scripts/bench.mjs 2> >(tee benchmark.stderr >&2) | tee benchmark.json
      - name: Verify failed threshold pipeline propagation
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          set +e
          node --input-type=module <<'JS' | tee benchmark-pipeline-probe.json
          import { emitBenchmarkReport, summarize } from './scripts/bench.mjs';
          const workload = summarize([101], 0, 101);
          const p95ThresholdMs = 100;
          emitBenchmarkReport({ benchmark: 'synthetic-threshold-pipeline-probe',
            workload, p95ThresholdMs, passed: workload.p95Ms <= p95ThresholdMs });
          JS
          probe_status=$?
          set -e
          printf 'Synthetic threshold pipeline exit=%s (expected 1)\n' "$probe_status"
          [[ "$probe_status" -eq 1 ]]
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('benchmark-pipeline-probe.json', 'utf8'));
          assert.equal(report.passed, false);
          assert.equal(report.workload.p95Ms, 101);
          assert.equal(report.p95ThresholdMs, 100);
          JS
      - name: Preserve benchmark evidence
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmark.json
            benchmark.stderr
            benchmark-pipeline-probe.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify release archive
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/verify-package.mjs
      - name: Build container
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: docker build --tag commerce-gateway:ci .
